{% extends "account/base_auth.html" %}

{% block title %}Password updated — RADEV LIVE{% endblock %}

{% block auth_content %}
    <h1 style="font-size:1.5rem;margin-bottom:.5rem">Password updated</h1>
    <p style="color:#A1A1AA;font-size:.875rem;margin-bottom:1.5rem">
        Your password has been changed. You can now sign in with your new password.
    </p>
    <a class="btn-submit" style="display:block;text-align:center;text-decoration:none" href="{% url 'account_login' %}">Log in</a>
{% endblock %}
