{% extends "account/base_auth.html" %}

{% block title %}Reset password — RADEV LIVE{% endblock %}

{% block auth_content %}
    <h1 style="font-size:1.5rem;margin-bottom:.5rem">Reset your password</h1>
    <p style="color:#A1A1AA;font-size:.875rem;margin-bottom:1.5rem">
        Enter the email address on your account and we'll send you a reset link.
    </p>
    <form method="post" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Send reset link</button>
    </form>
{% endblock %}
