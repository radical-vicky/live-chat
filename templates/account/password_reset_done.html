{% extends "account/base_auth.html" %}

{% block title %}Check your email — RADEV LIVE{% endblock %}

{% block auth_content %}
    <h1 style="font-size:1.5rem;margin-bottom:.5rem">Check your email</h1>
    <p style="color:#A1A1AA;font-size:.875rem;margin-bottom:1.5rem">
        If an account exists for that address, a password reset link is on its way.
    </p>
    <a class="btn-submit" style="display:block;text-align:center;text-decoration:none" href="{% url 'account_login' %}">Back to log in</a>
{% endblock %}
