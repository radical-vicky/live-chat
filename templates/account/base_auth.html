{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login — RADEV LIVE{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0A0A0A;
            --surface-color: #18181B;
            --text-main: #FAFAFA;
            --text-muted: #A1A1AA;
            --brand-orange: #F97316;
            --brand-orange-hover: #EA580C;
            --border-color: #27272A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh;
            height: auto;
            display: flex;
        }

        /* Layout */
        .auth-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            height: auto;
        }

        /* Left Panel (Image + Text) */
        .auth-left {
            flex: 1;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 4rem;
            overflow: hidden;
            background: #000;
        }

        .auth-left-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 1;
        }

        .auth-left::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 50%);
            z-index: 1;
            pointer-events: none;
        }

        .auth-left h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            color: white;
            margin-bottom: 0.5rem;
            z-index: 2;
            position: relative;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .auth-left p {
            color: white;
            font-size: 1rem;
            z-index: 2;
            position: relative;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        /* Right Panel (Dark) */
        .auth-right {
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center form vertically */
            align-items: center; /* Center form horizontally */
            padding: 4rem;
            background-color: var(--bg-color);
            position: relative;
        }

        .auth-form-wrapper {
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        .auth-mobile-brand { display: none; }
        .auth-mobile-switch { display: none; }

        /* Header Row (Tabs + Back Button) */
        .auth-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab {
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .tab.active {
            background-color: var(--brand-orange);
            color: white;
        }

        .tab.inactive {
            background-color: var(--surface-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .tab.inactive:hover {
            background-color: #27272A;
        }

        /* Back Button (Aligned with tabs) */
        .back-home-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .back-home-btn:hover {
            color: var(--text-main);
            background-color: #27272A;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-input, input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #121214 !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 0.5rem;
            color: var(--text-main) !important;
            font-family: inherit;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        .form-input:focus, input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--brand-orange) !important;
        }

        .form-input::placeholder, input::placeholder {
            color: #52525B;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #121214 inset !important;
            -webkit-text-fill-color: var(--text-main) !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Buttons */
        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--brand-orange);
            color: white;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--brand-orange-hover);
        }

        .btn-google {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--surface-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-google:hover {
            background-color: #27272A;
        }

        /* Error messages */
        .errorlist {
            color: #EF4444;
            font-size: 0.75rem;
            list-style: none;
            margin-top: 0.25rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body { min-height: 100dvh; height: auto; background: linear-gradient(155deg,#291407 0,#090909 42%); }
            .auth-container { min-height: 100dvh; height: auto; }
            .auth-left { display: none; }
            .auth-right { flex: 1; min-height: 100dvh; align-items: stretch; justify-content: center; padding: 28px clamp(18px, 5vw, 28px); background: transparent; }
            .auth-form-wrapper { max-width: 430px; margin: 0 auto; }
            .auth-mobile-brand { display: block; margin: 0 0 22px; color: var(--brand-orange); font-size: 1.1rem; font-weight: 800; text-decoration: none; }
            .auth-header-row { display: none; }
            
            /* Added text-decoration: none here to fix the underline */
            .auth-mobile-switch { 
                display: block; 
                width: 100%; 
                min-height: 46px; 
                margin-top: 12px; 
                border: 1px solid var(--border-color); 
                border-radius: 999px; 
                background: #202020; 
                padding: 11px; 
                color: white; 
                text-align: center; 
                font-size: .875rem; 
                font-weight: 600; 
                text-decoration: none; 
            }
            
            .form-group { margin-bottom: 17px; }
            .form-group label { font-size: .85rem; }
            .form-input, input[type="text"], input[type="email"], input[type="password"] { min-height: 48px; padding: 12px 14px; font-size: 16px; }
            .btn-submit,.btn-google { min-height: 48px; padding: 12px; font-size: .875rem; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- Left Panel with Image -->
        <div class="auth-left">
            <img src="{% static 'images/auth-bg.jpg' %}" alt="Auth Background" class="auth-left-image" onerror="this.style.display='none'">
            <h1>Welcome to RADEV<br>LIVE</h1>
            <p>Live sessions for everyone.</p>
        </div>

        <!-- Right Panel -->
        <div class="auth-right">
            <div class="auth-form-wrapper">
                <a href="{% url 'core:home' %}" class="auth-mobile-brand">RADEV LIVE</a>
                
                <!-- Header Row: Tabs (Left) and Back Button (Right) -->
                <div class="auth-header-row">
                    <div class="auth-tabs">
                        <a href="{% url 'account_login' %}" class="tab {% if request.resolver_match.url_name == 'account_login' %}active{% else %}inactive{% endif %}">Log in</a>
                        <a href="{% url 'account_signup' %}" class="tab {% if request.resolver_match.url_name == 'account_signup' %}active{% else %}inactive{% endif %}">Register</a>
                    </div>
                    
                    <a href="{% url 'core:home' %}" class="back-home-btn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                        Back
                    </a>
                </div>

                <!-- Dynamic Form Content -->
                {% block auth_content %}{% endblock %}
            </div>
        </div>
    </div>

</body>
</html>
